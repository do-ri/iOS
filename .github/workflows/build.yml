name: Build App

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup mise and Tuist
        uses: jdx/mise-action@v2

      - name: Prepare xcconfig files
        run: |
          mkdir -p Projects/App/Resources
          if [ ! -f Projects/App/Resources/Common.xcconfig ]; then
            printf "BASE_URL = https://hellodoriworld.com\n" > Projects/App/Resources/Common.xcconfig
          fi
          echo "✅ xcconfig file is ready"

      - name: Install Tuist dependencies
        run: tuist install

      - name: Generate workspace
        run: tuist generate --no-open

      - name: Build project
        run: |
          xcodebuild \
            -workspace Dori-iOS.xcworkspace \
            -scheme DoriApp \
            -configuration Debug \
            -skipMacroValidation \
            -destination "generic/platform=iOS Simulator" \
            clean build

      - name: Run unit tests (all *Tests schemes)
        run: |
          set -euo pipefail

          TEST_SCHEMES=$(
            xcodebuild -workspace Dori-iOS.xcworkspace -list -json | /usr/bin/python3 -c '
import json, sys
data = json.load(sys.stdin)
schemes = data.get("workspace", {}).get("schemes", []) or data.get("project", {}).get("schemes", [])
tests = [scheme for scheme in schemes if scheme.endswith("Tests")]
print("\n".join(tests))
'
          )

          if [ -z "$TEST_SCHEMES" ]; then
            echo "No *Tests schemes found. Skipping test step."
            exit 0
          fi

          SIMULATOR_ID=$(
            xcrun simctl list devices available -j | /usr/bin/python3 -c '
import json, sys
devices = json.load(sys.stdin).get("devices", {})
for runtime in sorted(devices.keys(), reverse=True):
    if "iOS" not in runtime:
        continue
    for device in devices[runtime]:
        if device.get("isAvailable") and "iPhone" in device.get("name", ""):
            print(device["udid"])
            raise SystemExit(0)
raise SystemExit(1)
'
          )

          echo "Using simulator id: $SIMULATOR_ID"
          echo "Test schemes:"
          echo "$TEST_SCHEMES"

          while IFS= read -r scheme; do
            [ -z "$scheme" ] && continue
            echo "Running tests for scheme: $scheme"
            xcodebuild \
              -workspace Dori-iOS.xcworkspace \
              -scheme "$scheme" \
              -configuration Debug \
              -skipMacroValidation \
              -destination "id=$SIMULATOR_ID" \
              test
          done <<< "$TEST_SCHEMES"
