name: Build App

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup mise and Tuist
        uses: jdx/mise-action@v2

      - name: Prepare xcconfig files
        run: |
          mkdir -p Projects/App/Resources
          if [ ! -f Projects/App/Resources/Common.xcconfig ]; then
            printf "BASE_URL = https://hellodoriworld.com\n" > Projects/App/Resources/Common.xcconfig
          fi
          echo "✅ xcconfig file is ready"

      - name: Install Tuist dependencies
        run: tuist install

      - name: Generate workspace
        run: tuist generate --no-open

      - name: Build project
        run: |
          xcodebuild \
            -workspace Dori-iOS.xcworkspace \
            -scheme DoriApp \
            -configuration Debug \
            -skipMacroValidation \
            -destination "generic/platform=iOS Simulator" \
            clean build
